[tool.pytest.ini_options]
cache_dir = ".payment-test-artifacts/pytest-cache"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = ".payment-test-artifacts/ruff-cache"
extend-exclude = [".test-tools", ".payment-test-artifacts", "ai_service"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
