services:
  - type: web
    name: neighborlend-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEPLOYMENT_EXPOSURE
        value: public
      - key: PAYMENT_PROVIDER
        value: disabled
      - key: PAYMENT_DEMO_MODE
        value: "false"
      - key: AUTO_MIGRATE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: AI_MODEL_PATH
        value: /app/ai_service/best_model.pt
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.45"
