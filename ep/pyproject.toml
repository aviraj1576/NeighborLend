[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neighborlend-ep"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "Pillow>=10.4", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.9"]
cv = ["numpy>=2,<3", "opencv-python>=4.10,<6", "psutil>=7,<8", "torch>=2.11,<3"]
v3 = ["kornia==0.8.2", "kornia_rs==0.1.10"]
assessment = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["ep_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --basetemp=.test-artifacts/tmp"
cache_dir = ".test-artifacts/pytest-cache"
markers = ["real_inference: genuine approved pretrained CUDA/CPU execution", "controlled_inference: native pretrained execution using generated synthetic pixels only"]

[tool.coverage.run]
source = ["ep_engine"]
branch = true
data_file = ".test-artifacts/.coverage"

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.coverage.html]
directory = ".test-artifacts/coverage-html"

[tool.coverage.json]
output = ".test-artifacts/coverage.json"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = ".test-artifacts/ruff-cache"
extend-exclude = [".runtime", ".test-artifacts", "test_images"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
